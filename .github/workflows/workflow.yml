name: Publish to PyPI and npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ai-slop-detector
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    # Publish only a commit that is on main and whose versions match the tag.
    - name: Check the tag, the package versions and main
      run: |
        version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        module=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/slop_detector/__init__.py').read()).group(1))")
        echo "tag ${GITHUB_REF_NAME}, pyproject ${version}, __version__ ${module}, commit ${GITHUB_SHA}"
        test "v${version}" = "${GITHUB_REF_NAME}"
        test "${module}" = "${version}"
        git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  npm-publish:
    name: Publish the npm wrapper
    # After PyPI: the wrapper's uvx / pipx fallback runs the PyPI release of its own version.
    needs: pypi-publish
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/ai-slop-detector
    permissions:
      contents: read
      id-token: write  # npm trusted publishing (OIDC); provenance is attached
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        registry-url: "https://registry.npmjs.org"

    - name: Use an npm with trusted publishing
      run: npm install -g npm@11

    - name: Check the wrapper version is the release version
      working-directory: npm-wrapper
      run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

    - name: Test the wrapper
      working-directory: npm-wrapper
      run: npm test

    - name: Publish to npm
      working-directory: npm-wrapper
      run: npm publish --provenance --access public
