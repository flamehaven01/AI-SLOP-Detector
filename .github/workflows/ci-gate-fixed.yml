name: AI Code Quality Gate (Fixed)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  # Basic Mode: Simple quality check without CI gate features
  quality-check-basic:
    name: Quality Check (Basic)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install AI SLOP Detector (this checkout)
        run: |
          pip install .
          slop-detector --version

      - name: Run Quality Analysis
        id: quality_check
        run: |
          slop-detector --project . --json > analysis_result.json
          cat analysis_result.json

      - name: Generate Report
        if: always()
        run: |
          slop-detector --project . -o report.md
          cat report.md

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: |
            analysis_result.json
            report.md

  # Threshold Mode: Fail if score exceeds threshold (working alternative)
  quality-gate-threshold:
    name: Quality Gate (Threshold)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install AI SLOP Detector (this checkout)
        run: |
          pip install .
          slop-detector --version

      - name: Run Quality Gate with Threshold
        run: |
          # Fail if deficit score > 70
          slop-detector --project . --fail-threshold 70

      - name: Upload Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-failure-report
          path: report.md

  # PR Comment Mode: Add analysis results as PR comment
  pr-comment:
    name: PR Analysis Comment
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install AI SLOP Detector (this checkout)
        run: |
          pip install .
          slop-detector --version

      - name: Run Analysis
        id: analysis
        run: |
          set +e
          slop-detector --project . -o report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # The report holds file names and messages from the PR's code: it is read
      # from the file as data, never interpolated into the script source.
      - name: Comment PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          ANALYSIS_EXIT: ${{ steps.analysis.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const limit = 60000;  // GitHub caps a comment at 65536 characters
            let body;
            if (process.env.ANALYSIS_EXIT !== '0' || !fs.existsSync('report.md')) {
              body = `Analysis failed (exit code ${process.env.ANALYSIS_EXIT}); no report was produced.`;
            } else {
              const report = fs.readFileSync('report.md', 'utf8');
              body = report.length > limit ? report.slice(0, limit) + '\n\n(report truncated)' : report;
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## AI Code Quality Analysis\n\n' + body
            });

      - name: Fail when the analysis failed
        if: steps.analysis.outputs.exit_code != '0'
        run: exit 1
