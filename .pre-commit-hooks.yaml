- id: slop-detector
  name: AI-SLOP Detector
  description: >
    Runs the hard CI gate and fails when the configured gate policy returns
    FAIL. Reports normal scan output before returning the gate exit code.
  entry: python -m slop_detector.cli
  language: python
  types: [python]
  pass_filenames: false
  args: ['--project', '.', '--ci-mode', 'hard']
  require_serial: false

- id: slop-detector-warn
  name: AI-SLOP Detector (Warn Only)
  description: >
    Runs the soft CI gate as an informational scan. Reports findings
    normally and does not fail for gate findings.
  entry: python -m slop_detector.cli
  language: python
  types: [python]
  pass_filenames: false
  args: ['--project', '.', '--ci-mode', 'soft']
  require_serial: false

- id: slop-detector-patterns
  name: AI-SLOP Detector (Patterns Only)
  description: >
    Pattern-only scoring of each changed file: LDR/ICR/DDC are reported but
    do not count toward deficit_score. Fails if any file's deficit_score
    exceeds 50.
  entry: python -m slop_detector.precommit
  language: python
  types: [python]
  pass_filenames: true
  args: ['--patterns-only', '--fail-threshold', '50']
  require_serial: false
